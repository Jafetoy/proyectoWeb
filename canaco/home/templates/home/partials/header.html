{% load static %}
{% with current=request.resolver_match.url_name %}

<!-- Menú móvil -->
<div class="site-mobile-menu site-navbar-target">
  <div class="site-mobile-menu-header">
    <div class="site-mobile-menu-close">
      <span class="icofont-close js-menu-toggle"></span>
    </div>
  </div>
  <div class="site-mobile-menu-body"></div>
</div>

<!-- Navegación principal -->
<nav class="site-nav">
  <div class="container">
    <div class="menu-bg-wrap">
      <div class="site-navigation">
        <a href="{% url 'home:index' %}" class="logo m-0">Canaco<span class="text-primary">.</span></a>
        <div class="site-navigation-center text-center">
          <form action="#" class="search-form d-inline-block d-lg-none">
            <input type="text" class="form-control" placeholder="Buscar...">
            <span class="bi-search"></span>
          </form>
          <ul class="js-clone-nav d-none d-lg-inline-block text-start site-menu mx-auto">
            <li class="{% if current == 'index' %}active{% endif %}"><a href="{% url 'home:index' %}">Inicio</a></li>
            <li class="has-children {% if current == 'categoria' %}active{% endif %}">
              <a href="{% url 'home:categoria' %}">Categoría</a>
              <ul class="dropdown">
                <li><a href="{% url 'home:categoria' %}">Todas</a></li>
              </ul>
            </li>
            <li class="{% if current == 'perfil' or current == 'crud_perfil' %}active{% endif %}"><a href="{% url 'home:perfil' %}">Perfil</a></li>
          </ul>
        </div>
        <div class="site-navigation-actions">
          <a href="#" class="burger ms-auto site-menu-toggle js-menu-toggle d-inline-block d-lg-none light">
            <span></span>
          </a>
          {% if request.user.is_authenticated %}
          <div class="d-none d-lg-flex align-items-center justify-content-end gap-2">
            <a href="{% url 'home:perfil' %}" class="text-white">{{ request.user.username }}</a>
            <form action="{% url 'home:logout' %}" method="post" class="m-0">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-outline-light">Cerrar sesión</button>
            </form>
          </div>
          {% else %}
          <div class="d-none d-lg-flex align-items-center justify-content-end gap-2">
            <a href="{% url 'home:login' %}" class="text-white">Iniciar sesión</a>
            <a href="{% url 'home:sign_up' %}" class="btn btn-sm btn-outline-light">Registro</a>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</nav>

{% endwith %}
