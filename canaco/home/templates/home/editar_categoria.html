{% extends 'home/partials/sidebar_base.html' %}
{% load static %}

{% block title %}Editar Categoría{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1 class="mb-4 text-center">Editar Categoría</h1>

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
      </div>
    {% endfor %}
  {% endif %}

  <div class="card col-md-8 mx-auto shadow-sm">
    <div class="card-body p-4">
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre de la categoría</label>
          <input type="text" id="nombre" name="nombre" class="form-control" value="{{ categoria.nombre }}" required>
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{% url 'home:crud_categorias' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
