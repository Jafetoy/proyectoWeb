# Replace noticias.example.com and issue the certificate before activating.
server {
    listen 80;
    server_name noticias.example.com;
    return 301 https://noticias.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name noticias.example.com;
    ssl_certificate /etc/letsencrypt/live/noticias.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noticias.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location /static/ {
        alias /srv/canaco/static/;
    }
    # Deny by default: uploaded files may contain personal or private data.
    # Enable public downloads only after classifying all files in this path.
    location /media/ {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
